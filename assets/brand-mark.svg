<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="derci logo">
  <defs>
    <filter id="logo-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="5" stdDeviation="3.2" flood-color="#000" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="word-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfe"/>
      <stop offset="1" stop-color="#e4edf4"/>
    </linearGradient>
    <radialGradient id="dot-fill" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#5be1ef"/>
      <stop offset="1" stop-color="#2cb1c6"/>
    </radialGradient>
  </defs>

  <g filter="url(#logo-shadow)">
    <text
      x="22"
      y="162"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="190"
      font-weight="600"
      letter-spacing="1"
      fill="url(#word-fill)"
      stroke="#9aa8b3"
      stroke-width="1.8"
      paint-order="stroke"
    >derci</text>
    <circle cx="783" cy="52" r="24" fill="url(#dot-fill)"/>
  </g>
</svg>
