<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-label="derci">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="word-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fcff"/>
      <stop offset="100%" stop-color="#dde7ef"/>
    </linearGradient>
    <radialGradient id="dot-gradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#53d8e7"/>
      <stop offset="100%" stop-color="#26a6bc"/>
    </radialGradient>
  </defs>

  <g filter="url(#soft-shadow)">
    <text
      x="24"
      y="132"
      font-size="152"
      font-family="Georgia, 'Times New Roman', serif"
      font-weight="600"
      letter-spacing="1.2"
      fill="url(#word-gradient)"
    >derci</text>
    <circle cx="651" cy="41" r="18" fill="url(#dot-gradient)"/>
  </g>
</svg>
